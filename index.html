<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>THE THINGS WE LEFT BEHIND</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20261115a">
</head>
<body>
<div id="app">
  <div id="monitor">
    <div class="casing-top">
      <div class="screw s1"></div>
      <div class="badge">
        <span class="badge-line">MAI TEAM · DEEP SPACE EXPLORATION UNIT</span>
        <span class="badge-model">DX-7 "SEEKER"</span>
      </div>
      <div class="screw s2"></div>
    </div>
    <div class="screen-bezel">
      <div id="screen">
        <canvas id="game" width="960" height="540"></canvas>
        <div id="scanlines"></div>
        <div id="glass"></div>
        <div id="touch">
          <button class="tbtn" id="t-left">◀</button>
          <button class="tbtn" id="t-right">▶</button>
          <button class="tbtn" id="t-jump">▲</button>
          <button class="tbtn t-e" id="t-act">E</button>
        </div>
      </div>
      <div class="bezel-right">
        <div class="led led-pwr on" title="POWER"></div>
        <div class="led led-sig" id="led-sig" title="SIGNAL"></div>
        <div class="led led-dsk" id="led-dsk" title="DISK"></div>
        <div class="vent"></div>
        <div class="plate">MODEL TLB-86<br>SN 1997-0704</div>
      </div>
    </div>
    <div class="casing-bottom">
      <div class="ports"><span></span><span></span><span></span></div>
      <div class="label">DISPLAY UNIT · ATMOSPHERIC PROCESSOR MK.IV · DO NOT EXPOSE TO DUST STORMS</div>
      <div class="screw s3"></div>
    </div>
  </div>
  <div id="footer">THE THINGS WE LEFT BEHIND — AN INTERACTIVE EXPERIENCE BY MAI TEAM · KEYBOARD RECOMMENDED</div>
</div>

<script src="js/world.js?v=20261115a"></script>
<script src="js/player.js?v=20261115a"></script>
<script src="js/dialogue.js?v=20261115c"></script>
<script src="js/minigames.js?v=20261115c"></script>
<script src="js/screens.js?v=20261115d"></script>
<script src="js/main.js?v=20261115c"></script>
</body>
</html>
